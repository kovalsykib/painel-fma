name: Calibrar com estações

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  calibrar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Baixar o Open-Meteo, calibrar e gerar o relatório
        run: python calibrar.py

      - name: Guardar o resultado no repositório
        run: |
          git config user.name "fma-bot"
          git config user.email "fma-bot@users.noreply.github.com"
          git add calibracao
          git diff --cached --quiet || git commit -m "Atualiza calibração"
          git push
