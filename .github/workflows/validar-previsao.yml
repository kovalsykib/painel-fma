name: Validar previsão da FMA (1 a 3 dias)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python validar_previsao.py
      - name: Salvar resultado
        if: always()
        run: |
          git config user.name "painel-fma"
          git config user.email "painel-fma@users.noreply.github.com"
          git add -A comparacao_modelos validacao_previsao.json
          git commit -m "Validação da previsão" || echo "nada a salvar"
          git pull --rebase || true
          git push
